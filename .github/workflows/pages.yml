name: Deploy Artist Level Up to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V101 Global Feed patch
        run: python scripts/patch_global_feed.py
      - name: Commit patched V101 source
        run: |
          git config user.name "Artist Level Up"
          git config user.email "artistlevelup@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "V101 harden Global Feed immediate render" && git push origin main)
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
