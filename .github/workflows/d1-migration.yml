name: Prepare Artist Level Up V101 D1

on:
  workflow_dispatch:
  push:
    branches:
      - migration/d1-v101-prep

permissions:
  contents: read

concurrency:
  group: artist-level-up-v101-d1-migration
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5

      - name: Validate all SQLite migrations
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          migrations = sorted(Path("migrations/d1").glob("[0-9][0-9][0-9][0-9]_*.sql"))
          numbers = [migration.name[:4] for migration in migrations]
          if numbers != ["0001", "0002", "0003", "0004", "0005"]:
              raise SystemExit(f"Expected migrations 0001–0005 exactly once, found {numbers}")

          for migration in migrations:
              if migration.name == "0003_move_published_song_to_r2.sql":
                  db.execute(
                      "INSERT INTO songs (id, artist_id, title, audio_url, status) VALUES (?, ?, ?, ?, ?)",
                      (
                          "44875219-61a6-46a6-aa3e-3cb6fb579092",
                          "2b2a5bf6-9673-42a1-a33a-d40dab98ad44",
                          "Otunba Cash Money Angelina",
                          "https://example.supabase.co/old-song.mp3",
                          "published",
                      ),
                  )
              print(f"Applying locally for validation: {migration}")
              db.executescript(migration.read_text())

          migrated = db.execute(
              "SELECT audio_url FROM songs WHERE id = ?",
              ("44875219-61a6-46a6-aa3e-3cb6fb579092",),
          ).fetchone()
          expected = (
              "https://pub-7e08b998aa8f48778971fec0f38c0993.r2.dev/"
              "audio_song_1792505499636_ilmfs-Otunba-Cash-Money-Angelina.mp3"
          )
          if not migrated or migrated[0] != expected:
              raise SystemExit("R2 song URL migration did not update the expected song.")

          violations = db.execute("PRAGMA foreign_key_check").fetchall()
          tables = db.execute(
              "SELECT count(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
          ).fetchone()[0]
          if violations:
              raise SystemExit(f"Foreign-key violations: {violations}")
          if tables != 30:
              raise SystemExit(f"Expected 30 tables after removing unused password-auth tables, found {tables}")

          owner_id = "d6eaf421-fcad-44ec-beb0-d6a7f676db8a"
          artist_id = "2b2a5bf6-9673-42a1-a33a-d40dab98ad44"
          owner = db.execute(
              "SELECT id, display_name, avatar_url, role FROM profiles"
          ).fetchall()
          artists = db.execute(
              "SELECT id, user_id, artist_name, status, suspended FROM artists"
          ).fetchall()
          admins = db.execute(
              "SELECT user_id, active FROM platform_admins"
          ).fetchall()
          if owner != [(owner_id, "Solo_vibez", None, "artist")]:
              raise SystemExit(f"Unexpected profile import: {owner}")
          if artists != [(artist_id, owner_id, "Solo_vibez", "pending", 0)]:
              raise SystemExit(f"Unexpected artist import: {artists}")
          if admins != [(owner_id, 1)]:
              raise SystemExit(f"Unexpected admin import: {admins}")
          if db.execute("SELECT count(*) FROM artist_videos").fetchone()[0] != 0:
              raise SystemExit("Identity migration must not seed video metadata.")
          if db.execute("SELECT count(*) FROM picture_posts").fetchone()[0] != 0:
              raise SystemExit("Identity migration must not seed picture posts.")
          print(f"Validated {len(migrations)} migrations, {tables} tables, and exactly one owner identity; no foreign-key violations.")
          PY

      - name: Check V101 inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.parts = []
                  self.current = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.inside = True
                      self.current = []

              def handle_data(self, data):
                  if self.inside:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.inside:
                      source = "".join(self.current)
                      if source.strip():
                          self.parts.append(source)
                      self.inside = False
                      self.current = []

          parser = Scripts()
          parser.feed(Path("Artist-Level-Up-LAUNCH-MASTER.html").read_text())
          if not parser.parts:
              raise SystemExit("No inline JavaScript found in V101 HTML.")
          for index, source in enumerate(parser.parts, 1):
              Path(f"/tmp/alu-v101-script-{index}.js").write_text(source)
          print(f"Extracted {len(parser.parts)} inline script blocks for syntax checking.")
          PY
          for script in /tmp/alu-v101-script-*.js; do node --check "$script"; done

      - name: Check auth Worker JavaScript syntax
        run: node --input-type=module --check < workers/auth/worker.js

      - name: Run auth and authenticated data API tests
        run: node --test workers/auth/*.test.mjs

      - name: Confirm remote apply is deliberately disabled
        run: echo "Validation only. Remote D1 apply is not enabled in this workflow."
