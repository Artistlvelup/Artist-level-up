<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artist Level Up — V101 Owner Control Room</title>
<style>
:root{color-scheme:dark;--bg:#081426;--panel:#10233d;--line:#244466;--ink:#eef6ff;--muted:#9bb2ca;--gold:#ffd36a;--blue:#42a5f5;--red:#ff7676}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#071426,#102e50);color:var(--ink);font:15px/1.5 system-ui,Arial,sans-serif}main{max-width:1180px;margin:auto;padding:24px 16px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}h1{font-size:clamp(24px,4vw,36px);margin:0;color:var(--gold)}h2{margin:0 0 12px}p{color:var(--muted)}.panel,.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat strong{display:block;font-size:28px;color:var(--gold)}button,input,select{font:inherit;border-radius:10px;padding:11px 13px}input,select{background:#07182c;color:var(--ink);border:1px solid var(--line);width:100%;margin:5px 0 12px}button{border:0;background:var(--gold);color:#18263a;font-weight:700;cursor:pointer;margin:3px}button.secondary{background:#244466;color:white}button.danger{background:#8f313d;color:white}button:disabled{opacity:.5;cursor:wait}.tabs{display:flex;flex-wrap:wrap;gap:5px}.tabs button{background:#193a5c;color:#eaf4ff}.tabs button.active{background:var(--gold);color:#17263a}.hidden{display:none!important}.muted{color:var(--muted)}.status{padding:4px 9px;border-radius:99px;background:#1b466b;font-size:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--gold)}td small{display:block;color:var(--muted);overflow-wrap:anywhere;max-width:300px}.notice{padding:12px;border-radius:10px;background:#173655;color:#dceeff;margin:12px 0}.error{color:#ffaaaa}.login{max-width:440px;margin:9vh auto}.login button{width:100%}a{color:#91d0ff}
</style></head>
<body><main>
<header><div><h1>Artist Level Up</h1><div class="muted">V101 · Cloudflare Owner Control Room</div></div><button id="logout" class="secondary hidden">Sign out</button></header>
<section id="login" class="panel login"><h2>Owner sign in</h2><p>Sign in using your existing V101 account. This control room uses Cloudflare authentication.</p>
<label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Owner email">
<label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password">
<button id="signin">Sign in securely</button><p id="loginMsg" class="muted"></p></section>
<section id="app" class="hidden">
<div id="welcome" class="notice">Connected to V101 Cloudflare backend.</div>
<div class="grid" id="stats"></div>
<div class="panel"><div class="tabs" id="tabs">
<button data-view="songs" class="active">Music</button><button data-view="videos">Videos</button><button data-view="beats">Marketplace beats</button><button data-view="pictures">Picture posts</button><button data-view="withdrawals">Withdrawals</button><button data-view="distribution">Music distribution</button><button data-view="payments">Paystack status</button>
</div><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0"><h2 id="viewTitle">Music</h2><button id="refresh" class="secondary">Refresh</button></div><div id="message" class="muted"></div><div class="tablewrap" id="records"></div></div>
</section></main>
<script>
(()=>{'use strict';
const API='https://artistlevelup.com.ng', $=id=>document.getElementById(id);
let token=sessionStorage.getItem('alu_v101_owner_token')||'', view='songs', rows=[];
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,{method='GET',body}={}){const res=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||data.message||'Request failed ('+res.status+')');return data}
function signedIn(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');}
function signedOut(msg=''){token='';sessionStorage.removeItem('alu_v101_owner_token');$('app').classList.add('hidden');$('logout').classList.add('hidden');$('login').classList.remove('hidden');$('loginMsg').textContent=msg;}
async function login(){ $('signin').disabled=true;$('loginMsg').textContent='Signing in…';try{const d=await request('/auth/login',{method:'POST',body:{email:$('email').value.trim(),password:$('password').value}});token=d.token;if(!token)throw new Error('Cloudflare did not return a session.');sessionStorage.setItem('alu_v101_owner_token',token);const s=await request('/api/admin/session');if(!s.isAdmin)throw new Error('This account does not have V101 owner-admin access.');signedIn();await loadStats();await loadView(view);}catch(e){signedOut(e.message)}finally{$('signin').disabled=false;}}
async function loadStats(){const d=await request('/api/admin/dashboard');const s=d.stats||{};$('stats').innerHTML=Object.entries(s).map(([k,v])=>'<div class="stat"><span class="muted">'+esc(k.replace(/([A-Z])/g,' $1'))+'</span><strong>'+esc(v)+'</strong></div>').join('');}
const cfg={
 songs:{title:'Music submissions',path:'/api/admin/songs',key:'songs',actions:['approved','published','rejected','archived']},
 videos:{title:'Artist videos',path:'/api/admin/videos',key:'videos',actions:['approved','published','rejected']},
 beats:{title:'Marketplace beats',path:'/api/admin/marketplace/beats',key:'beats',actions:['approved','rejected','archived']},
 pictures:{title:'Picture posts',path:'/api/admin/pictures',key:'pictures',actions:['approved','published','rejected','hidden']},
 withdrawals:{title:'Withdrawal requests',path:'/api/admin/withdrawals',key:'withdrawals',actions:[]}
};
function displayRows(items){rows=items||[];if(!rows.length){$('records').innerHTML='<div class="notice">No records found in this section.</div>';return}
const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(k=>!['user_id','artist_id'].includes(k)).slice(0,7);
$('records').innerHTML='<table><thead><tr>'+cols.map(k=>'<th>'+esc(k.replace(/_/g,' '))+'</th>').join('')+'<th>Action</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr>'+cols.map(k=>{let v=r[k];if(typeof v==='string'&&/^https?:\/\//.test(v))return '<td><a href="'+esc(v)+'" target="_blank" rel="noopener">Open media</a></td>';return '<td>'+esc(typeof v==='object'?JSON.stringify(v):v)+'</td>'}).join('')+'<td>'+((cfg[view]?.actions||[]).map(st=>'<button class="secondary" data-row="'+i+'" data-status="'+st+'">'+esc(st)+'</button>').join('')||'—')+'</td></tr>').join('')+'</tbody></table>';}
async function loadView(next=view){view=next;$('viewTitle').textContent=cfg[view]?.title||({distribution:'Music distribution requests',payments:'Paystack configuration'}[view]||view);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('message').textContent='Loading from Cloudflare…';$('records').innerHTML='';
try{
 if(cfg[view]){const d=await request(cfg[view].path+(view==='withdrawals'?'?limit=100':'?limit=100'));displayRows(d[cfg[view].key]||[]);}
 else if(view==='distribution'){const d=await request('/api/admin/distribution',{method:'POST',body:{operation:'admin_list'}});displayRows(d.requests||[]);}
 else if(view==='payments'){const d=await request('/api/payments/health');$('records').innerHTML='<div class="notice">Paystack secret configured: <strong>'+ (d.paystack_configured?'Yes':'No') +'</strong>. A live transaction and webhook still need a real end-to-end test.</div>';rows=[];}
 $('message').textContent='Loaded from V101 Cloudflare backend.';
 }catch(e){$('message').textContent=e.message;$('records').innerHTML='<div class="notice error">'+esc(e.message)+'</div>';if(/session|admin access|expired/i.test(e.message))signedOut(e.message);}
}
$('signin').addEventListener('click',login);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('logout').addEventListener('click',async()=>{try{await request('/auth/logout',{method:'POST'})}catch{}signedOut('You have signed out.');});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)loadView(b.dataset.view)});
$('refresh').addEventListener('click',async()=>{try{await loadStats();await loadView(view)}catch(e){$('message').textContent=e.message}});
$('records').addEventListener('click',async e=>{const b=e.target.closest('[data-row]');if(!b)return;const row=rows[Number(b.dataset.row)],id=row?.id;if(!id)return;if(!confirm('Change this record status to '+b.dataset.status+'?'))return;b.disabled=true;try{let path=cfg[view].path+'/'+encodeURIComponent(id);await request(path,{method:'PATCH',body:{status:b.dataset.status}});await loadView(view);await loadStats()}catch(err){$('message').textContent=err.message;b.disabled=false}});
if(token){request('/api/admin/session').then(s=>{if(!s.isAdmin)throw new Error('Admin access required');signedIn();return loadStats()}).then(()=>loadView(view)).catch(e=>signedOut(e.message));}
})();
</script></body></html>
