name: Prepare Artist Level Up V101 D1

on:
  workflow_dispatch:
  push:
    branches:
      - migration/d1-v101-prep

permissions:
  contents: read

concurrency:
  group: artist-level-up-v101-d1-migration
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5

      - name: Validate all SQLite migrations
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          migrations = sorted(Path("migrations/d1").glob("[0-9][0-9][0-9][0-9]_*.sql"))
          numbers = [migration.name[:4] for migration in migrations]
          if numbers != ["0001", "0002", "0003", "0004", "0005", "0006"]:
              raise SystemExit(f"Expected migrations 0001–0006 exactly once, found {numbers}")

          for migration in migrations:
              if migration.name == "0003_move_published_song_to_r2.sql":
                  db.execute(
                      "INSERT INTO songs (id, artist_id, title, audio_url, status) VALUES (?, ?, ?, ?, ?)",
                      (
                          "44875219-61a6-46a6-aa3e-3cb6fb579092",
                          "2b2a5bf6-9673-42a1-a33a-d40dab98ad44",
                          "Otunba Cash Money Angelina",
                          "https://example.supabase.co/old-song.mp3",
                          "published",
                      ),
                  )
              print(f"Applying locally for validation: {migration}")
              db.executescript(migration.read_text())

          migrated = db.execute(
              "SELECT audio_url FROM songs WHERE id = ?",
              ("44875219-61a6-46a6-aa3e-3cb6fb579092",),
          ).fetchone()
          expected = (
              "https://pub-7e08b998aa8f48778971fec0f38c0993.r2.dev/"
              "audio_song_1792505499636_ilmfs-Otunba-Cash-Money-Angelina.mp3"
          )
          if not migrated or migrated[0] != expected:
              raise SystemExit("R2 song URL migration did not update the expected song.")

          violations = db.execute("PRAGMA foreign_key_check").fetchall()
          tables = db.execute(
              "SELECT count(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
          ).fetchone()[0]
          if violations:
              raise SystemExit(f"Foreign-key violations: {violations}")
          if tables != 33:
              raise SystemExit(f"Expected 33 tables including native password-auth tables, found {tables}")

          auth_tables = {
              "app_users", "app_sessions", "app_session_families",
              "app_credentials", "app_email_verification_tokens", "app_auth_rate_limits",
          }
          actual_tables = {
              row[0] for row in db.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
              )
          }
          missing_auth_tables = auth_tables - actual_tables
          if missing_auth_tables:
              raise SystemExit(f"Missing native auth tables: {sorted(missing_auth_tables)}")

          credential_columns = {
              row[1] for row in db.execute("PRAGMA table_info(app_credentials)")
          }
          required_credential_columns = {
              "user_id", "email_normalized", "password_hash", "password_salt",
              "password_iterations", "email_verified_at", "password_changed_at",
          }
          if not required_credential_columns.issubset(credential_columns):
              raise SystemExit("Native credential schema is missing required columns.")

          for table in ("app_credentials", "app_email_verification_tokens"):
              foreign_keys = db.execute(f"PRAGMA foreign_key_list({table})").fetchall()
              if not any(row[2] == "app_users" and row[6].upper() == "CASCADE" for row in foreign_keys):
                  raise SystemExit(f"{table} must cascade-delete with its D1 user.")

          email_indexes = db.execute("PRAGMA index_list(app_credentials)").fetchall()
          if not any(row[2] for row in email_indexes):
              raise SystemExit("Normalized account email must be unique.")

          owner = db.execute("SELECT count(*) FROM profiles").fetchone()[0]
          artists = db.execute("SELECT count(*) FROM artists").fetchone()[0]
          admins = db.execute("SELECT count(*) FROM platform_admins").fetchone()[0]
          if owner or artists or admins:
              raise SystemExit(
                  f"Cloudflare identity database must remain empty; found "
                  f"{owner} profiles, {artists} artists, and {admins} admins."
              )
          if db.execute("SELECT count(*) FROM artist_videos").fetchone()[0] != 0:
              raise SystemExit("Identity migration must not seed video metadata.")
          if db.execute("SELECT count(*) FROM picture_posts").fetchone()[0] != 0:
              raise SystemExit("Identity migration must not seed picture posts.")
          print(f"Validated {len(migrations)} migrations and {tables} tables, including native password auth; no accounts imported and no foreign-key violations.")
          PY

      - name: Check V101 inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("Artist-Level-Up-LAUNCH-MASTER.html").read_text()
          # HTMLParser treats '<' inside JavaScript template strings as markup.
          # Extract script bodies with a raw-text-aware regex instead.
          scripts = re.findall(
              r"<script\b[^>]*>([\s\S]*?)</script\s*>",
              html,
              flags=re.IGNORECASE,
          )
          parts = [source for source in scripts if source.strip()]
          if not parts:
              raise SystemExit("No inline JavaScript found in V101 HTML.")
          for index, source in enumerate(parts, 1):
              Path(f"/tmp/alu-v101-script-{index}.js").write_text(source)
          print(f"Extracted {len(parts)} inline script blocks for syntax checking.")
          PY
          for script in /tmp/alu-v101-script-*.js; do node --check "$script"; done

      - name: Check auth Worker JavaScript syntax
        run: node --input-type=module --check < workers/auth/worker.js

      - name: Run current Worker API and password-auth route tests
        run: node --test workers/auth/password-auth-routes.test.mjs workers/auth/data-api.test.mjs workers/auth/promotions.test.mjs workers/auth/songs.test.mjs

      - name: Confirm remote apply is deliberately disabled
        run: echo "Validation only. Remote D1 apply is not enabled in this workflow."
