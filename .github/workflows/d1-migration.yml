name: Prepare Artist Level Up V101 D1

on:
  workflow_dispatch:
    inputs:
      apply_remote:
        description: "Apply the D1 schema to the remote database (only after reviewing the migration)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: artist-level-up-v101-d1-migration
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Validate complete SQLite migration sequence
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          files = [
              Path("migrations/d1/0001_initial_schema.sql"),
              Path("migrations/d1/0002_identity_sessions.sql"),
              Path("migrations/d1/0004_persistent_session_families.sql"),
              Path("migrations/d1/0006_password_auth.sql"),
              Path("migrations/d1/0007_passwordless_login_links.sql"),
          ]
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          for path in files:
              if not path.is_file():
                  raise SystemExit(f"Missing migration: {path}")
              db.executescript(path.read_text())
              print(f"Validated {path}")

          tables = {
              row[0] for row in db.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
              )
          }
          required = {
              "profiles", "artists", "songs", "artist_videos", "picture_posts",
              "marketplace_beats", "marketplace_orders", "streaming_distribution_requests",
              "withdrawals", "app_users", "app_sessions", "app_session_families",
              "app_credentials", "app_email_verification_tokens", "app_auth_rate_limits",
              "app_login_link_tokens",
          }
          missing = required - tables
          if missing:
              raise SystemExit(f"Missing required tables: {sorted(missing)}")
          if "v101_bridge_config" in tables:
              raise SystemExit("Obsolete bridge configuration table must not exist.")
          violations = db.execute("PRAGMA foreign_key_check").fetchall()
          if violations:
              raise SystemExit(f"Foreign-key violations: {violations}")
          print(f"Validated all {len(files)} migrations and {len(tables)} tables; required tables present; no foreign-key violations.")
          PY

  apply:
    needs: validate
    if: ${{ inputs.apply_remote == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Apply schema to Cloudflare D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply artist_level_up_v101 --remote
