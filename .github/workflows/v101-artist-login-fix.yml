name: V101 artist login surgical fix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v101-artist-login-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V101 member cloud login gate
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.find('<script id="aluMemberGateV101">')
          if start < 0:
              raise SystemExit("member gate marker not found")
          end=s.find('</script>', start)
          if end < 0:
              raise SystemExit("member gate closing script not found")
          end += len('</script>')
          new=r'''<script id="aluMemberGateV101">
(function(){
'use strict';
if(window.__ALU_MEMBER_GATE_V101)return;
window.__ALU_MEMBER_GATE_V101=true;
function getState(){return (typeof state!=='undefined'&&state)?state:null}
function registered(){var s=getState();return !!(s&&s.userRegistered===true&&s.userAccount&&String(s.userAccount.email||'').trim()&&s.memberAccessV101===true)}
function persist(){var s=getState();if(!s)return;try{localStorage.setItem('alu_full_v1',JSON.stringify(s))}catch(e){}try{if(typeof renderAll==='function')renderAll()}catch(e){}}
function client(){return window.ALU_SUPABASE_CLIENT||null}
async function linkCurrentAnonymous(email){
  var c=client();if(!c||!c.auth)return {linked:false};
  try{
    var g=await c.auth.getSession(),session=g?.data?.session;
    if(!session?.user)return {linked:false};
    if(session.user.is_anonymous){
      var u=await c.auth.updateUser({email:email});
      if(u.error) return {linked:false,error:u.error};
      return {linked:true,pending:true};
    }
    return {linked:true,pending:false};
  }catch(e){return {linked:false,error:e}}
}
async function sendMagicLink(email){
  var c=client();if(!c||!c.auth)throw new Error('Cloud login is not ready. Please reopen the app.');
  var r=await c.auth.signInWithOtp({email:email,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});
  if(r.error)throw r.error;
}
function ensureGate(){
  var old=document.getElementById('aluMemberGateV101');if(old)return old;
  var wrap=document.createElement('div');wrap.id='aluMemberGateV101';
  wrap.innerHTML='<div class="alu-member-card" role="dialog" aria-modal="true" aria-labelledby="aluMemberGateTitle">'+
    '<div class="alu-member-logo">ARTIST <span>LEVEL UP</span></div><div class="pill">MEMBER ACCESS</div>'+
    '<h1 id="aluMemberGateTitle">Welcome to Artist Level Up 👋</h1>'+
    '<p class="muted">Use your email to create or securely log in to your member account. Your Artist account uses this same member identity.</p>'+
    '<div class="alu-member-tabs"><button type="button" class="alu-member-tab active" data-member-tab="create">Create Account</button><button type="button" class="alu-member-tab" data-member-tab="login">Log In</button></div>'+
    '<div id="aluMemberCreateForm" class="alu-member-form active"><label>Name</label><input id="aluMemberName" type="text" autocomplete="name" placeholder="Your name"><label>Email</label><input id="aluMemberEmail" type="email" autocomplete="email" placeholder="you@example.com"><label class="alu-member-check"><input id="aluMemberAgreement" type="checkbox"><span>I agree to the Terms &amp; Conditions and User Agreement.</span></label><div id="aluMemberCreateError" class="alu-member-error"></div><button type="button" id="aluMemberCreateBtn" class="btn primary full">Create My Account</button></div>'+
    '<div id="aluMemberLoginForm" class="alu-member-form"><label>Email</label><input id="aluMemberLoginEmail" type="email" autocomplete="email" placeholder="Your member email"><div id="aluMemberLoginError" class="alu-member-error"></div><button type="button" id="aluMemberLoginBtn" class="btn primary full">Send Login Link</button><p class="tiny muted">We will send a secure sign-in link to your email. Tap it to return to Artist Level Up.</p></div>'+
    '<p class="alu-member-note">No password is stored by Artist Level Up. Keep your email account secure.</p></div>';
  document.body.appendChild(wrap);
  function tab(name){wrap.querySelectorAll('[data-member-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.memberTab===name)});document.getElementById('aluMemberCreateForm').classList.toggle('active',name==='create');document.getElementById('aluMemberLoginForm').classList.toggle('active',name==='login');document.getElementById('aluMemberGateTitle').textContent=name==='create'?'Welcome to Artist Level Up 👋':'Welcome Back 👋'}
  wrap.addEventListener('click',function(e){var t=e.target.closest('[data-member-tab]');if(t)tab(t.dataset.memberTab)});
  document.getElementById('aluMemberCreateBtn').addEventListener('click',async function(){
    var s=getState(),name=(document.getElementById('aluMemberName').value||'').trim(),email=(document.getElementById('aluMemberEmail').value||'').trim().toLowerCase(),agree=document.getElementById('aluMemberAgreement').checked===true,err=document.getElementById('aluMemberCreateError');err.textContent='';
    if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent='Enter your name and a valid email.';return}
    if(!agree){err.textContent='Please accept the Terms & Conditions and User Agreement.';return}
    if(!s){err.textContent='Member account service is not ready. Please reopen the app.';return}
    var b=this;b.disabled=true;b.textContent='CONNECTING ACCOUNT…';
    try{
      var linked=await linkCurrentAnonymous(email);
      if(linked.error && /already|exists|duplicate/i.test(String(linked.error.message||linked.error)))throw new Error('That email already has a cloud account. Open Log In and use the login link instead.');
      s.userAccount={...(s.userAccount||{}),name:name,email:email,registeredAt:s.userAccount?.registeredAt||new Date().toISOString(),agreementAcceptedAt:new Date().toISOString(),agreementVersion:'V101'};
      s.profile={...(s.profile||{}),name:name,email:email,saved:true};s.userRegistered=true;s.userAccountCounted=true;s.memberAccessV101=true;
      try{save()}catch(e){persist()}
      close();
      if(linked.pending){toast('Account saved ✓ Check your email to activate cloud login.')}
      else{toast('Welcome to Artist Level Up ✓')}
    }catch(e){console.error('Member cloud account setup failed:',e);err.textContent=String(e?.message||e||'Cloud account setup failed.');}
    finally{b.disabled=false;b.textContent='Create My Account'}
  });
  document.getElementById('aluMemberLoginBtn').addEventListener('click',async function(){
    var s=getState(),email=(document.getElementById('aluMemberLoginEmail').value||'').trim().toLowerCase(),err=document.getElementById('aluMemberLoginError');err.textContent='';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent='Enter your member email.';return}
    var b=this;b.disabled=true;b.textContent='SENDING…';
    try{
      var linked=await linkCurrentAnonymous(email);
      if(linked.error && /already|exists|duplicate/i.test(String(linked.error.message||linked.error))){
        await sendMagicLink(email);
        err.textContent='Login link sent ✓ Check your email and tap the link.';
        return;
      }
      if(linked.pending){
        err.textContent='Login link sent ✓ Check your email and tap the link.';
        return;
      }
      await sendMagicLink(email);
      s.userRegistered=true;s.memberAccessV101=true;s.userAccount={...(s.userAccount||{}),email:email};
      try{save()}catch(e){persist()}
      err.textContent='Login link sent ✓ Check your email and tap the link.';
    }catch(e){console.error('Member login failed:',e);err.textContent=String(e?.message||e||'Cloud login failed. Please try again.');}
    finally{b.disabled=false;b.textContent='Send Login Link'}
  });
  return wrap;
}
function open(){var g=ensureGate();if(!g)return;g.classList.add('show');document.body.classList.add('alu-member-locked-v101');setTimeout(function(){var n=document.getElementById('aluMemberName'),l=document.getElementById('aluMemberLoginEmail');try{(registered()?l:n)?.focus()}catch(e){}},80)}
function close(){var g=document.getElementById('aluMemberGateV101');if(g)g.classList.remove('show');document.body.classList.remove('alu-member-locked-v101')}
window.ALU_MEMBER_GATE_V101={open:open,close:close,isRegistered:registered};
function boot(){if(registered())return;open()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else setTimeout(boot,0);
})();
</script>'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "Artist Level Up Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "V101 fix persistent artist member login" || true
          git rm .github/workflows/v101-artist-login-fix.yml
          git commit -m "Remove temporary V101 login patch workflow" || true
          git push
